name: 🎖️ promote

run-name: >-
  🎖️ @${{ github.event.review.user.login }} approving the release of
  ${{ github.event.pull_request.head.sha }}

# The push happens here because no GitHub merge button can fast-forward:
# rebase-and-merge rewrites every SHA, which forked the branches in September
# 2026, and a merge commit adds one.

on:
  pull_request_review:
    types: [submitted]

# contents to push main, actions to dispatch the release run afterwards.
permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    name: 🎖️ promote
    if: >-
      github.event.review.state == 'approved'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.ref == 'next'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUMBER: ${{ github.event.pull_request.number }}
      REVIEWED: ${{ github.event.review.commit_id }}
      ASSOCIATION: ${{ github.event.review.author_association }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # reviewDecision stays null until a review is required, so ownership
      # stands in for it. Delegating approval means requiring the review.
      - id: gate
        run: |
          decision="$(gh pr view "$NUMBER" --json reviewDecision --jq '.reviewDecision // "NONE"')"
          echo "reviewDecision=$decision authorAssociation=$ASSOCIATION"
          case "$decision:$ASSOCIATION" in
            APPROVED:*|NONE:OWNER) echo 'approved=true' >> "$GITHUB_OUTPUT" ;;
          esac
      - if: steps.gate.outputs.approved == 'true'
        run: |
          git fetch origin main next
          # Promoting past the reviewed commit would ship unreviewed ones.
          if [ "$REVIEWED" != "$(git rev-parse origin/next)" ]; then
            echo "::error::next moved since the approval, so $REVIEWED is not its tip"
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main origin/next; then
            echo '::error::main is not an ancestor of next, so this is not a fast-forward'
            exit 1
          fi
          git push origin origin/next:refs/heads/main
      # A push made with the repository token raises no events, so the release
      # run has to be asked for by name.
      - if: steps.gate.outputs.approved == 'true'
        run: gh workflow run workflow.yml --ref main
