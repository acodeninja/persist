name: ⚗️ branch workflow

run-name: ⚗️ @${{ github.triggering_actor }} triggered branch workflow on ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - next
  pull_request:
  # Invoked by name after a promotion fast-forwards main.
  workflow_dispatch:

jobs:
  lint:
    name: 🧹 lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run init
      - run: mise run lint

  test-with-coverage:
    name: 🧪 test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: jdx/mise-action@v4
      - run: mise run init
      - run: mise run test:coverage
      - run: curl https://deepsource.io/cli | sh
      - name: deepsource report
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
        run: |
          ./bin/deepsource report \
            --analyzer test-coverage \
            --key javascript \
            --value-file "$(realpath ./coverage/lcov.info)"

  release-pr:
    name: 🔀 release pr
    timeout-minutes: 2
    # The bot has to author it: nobody can approve their own pull request, and
    # approving is what promotes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    needs: [ publish-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: release-pr
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: |
          git fetch --tags origin
          if ! git merge-base --is-ancestor origin/main origin/next; then
            echo '::error::main has commits of its own, so the promotion cannot fast-forward'
            exit 1
          fi
          node scripts/release-notes.mjs > pr_body.md
          title="promote $(git describe --tags --abbrev=0 --match 'v*-next.*' origin/next 2>/dev/null || echo next)"
          number="$(gh pr list --base main --head next --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file pr_body.md
          else
            gh pr create --base main --head next --title "$title" --body-file pr_body.md
          fi

  publish-release:
    name: 📋 publish release
    timeout-minutes: 10
    if: contains(fromJSON('["refs/heads/main", "refs/heads/next"]'), github.ref)
    needs: [ lint, test-with-coverage ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: npm clean-install
      # A held release still goes green, so say so loudly.
      - run: |
          if grep -q 'dryRun: true' release.config.js; then
            echo '::warning::releases are held in dry run; nothing will be published'
          fi
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
