name: ⚗️ branch workflow

run-name: ⚗️ @${{ github.triggering_actor }} triggered branch workflow on ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - next
  pull_request:
  # The promotion fast-forwards main with the repository token, which raises no
  # events, so the production run has to be asked for by name.
  workflow_dispatch:

jobs:
  lint:
    name: 🧹 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run init
      - run: mise run lint

  test-with-coverage:
    name: 🧪 test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: jdx/mise-action@v4
      - run: mise run init
      - run: mise run test:coverage
      - run: curl https://deepsource.io/cli | sh
      - name: deepsource report
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
        run: |
          ./bin/deepsource report \
            --analyzer test-coverage \
            --key javascript \
            --value-file "$(realpath ./coverage/lcov.info)"

  release-pr:
    name: 🔀 release pr
    # Keeps a standing next to main pull request, because approving it is what
    # promotes. The bot has to be the author: GitHub refuses to let anyone
    # approve their own pull request, so one opened by hand could never satisfy
    # the gate it exists for.
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    needs: [ lint, test-with-coverage ]
    runs-on: ubuntu-latest
    # Replaces the workflow permissions rather than adding to them, so the
    # id-token publish-release needs is deliberately absent here.
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: release-pr
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: |
          git fetch origin
          if ! git merge-base --is-ancestor origin/main origin/next; then
            echo '::warning::main has commits of its own, so the promotion will not fast-forward'
          fi
          node scripts/release-notes.mjs > pr_body.md
          number="$(gh pr list --base main --head next --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file pr_body.md
          else
            gh pr create --base main --head next --title 'release next to production' --body-file pr_body.md
          fi

  publish-release:
    name: 📋 publish release
    # Gated on the ref alone: a pull request's ref is refs/pull/<n>/merge, which
    # matches neither branch, and a dispatched run on main matches main.
    if: contains(fromJSON('["refs/heads/main", "refs/heads/next"]'), github.ref)
    needs: [ lint, test-with-coverage ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: npm clean-install
      # semantic-release says so too, but a held release still goes green, and a
      # green release job is indistinguishable from a quiet month.
      - run: |
          if grep -q 'dryRun: true' release.config.js; then
            echo '::warning::releases are held in dry run; nothing will be published'
          fi
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
